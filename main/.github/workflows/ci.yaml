name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5434:5432
        env:
          POSTGRES_USER: taruun
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: tasks
        options: >-
          --health-cmd="pg_isready -U taruun -d tasks"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5434
      DB_USER: taruun
      DB_PASS: 123456
      DB_NAME: tasks

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5434 -U taruun; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations (if any)
        working-directory: ./app
        run: |
          if [ -f "npm run migrate" ]; then
            npm run migrate
          fi

      - name: Run tests
        working-directory: ./app
        run: npm test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/taskscheduler:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/taskscheduler:latest
