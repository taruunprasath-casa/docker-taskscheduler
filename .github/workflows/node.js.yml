name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5434:5432
        env:
          POSTGRES_USER: taruun
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: tasks
        options: >-
          --health-cmd="pg_isready -U taruun -d tasks"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5434
      DB_USER: taruun
      DB_PASS: 123456
      DB_NAME: tasks

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: main/app/package-lock.json

      - name: Install dependencies
        working-directory: main/app
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5434 -U taruun; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations (if any)
        working-directory: main/app
        run: |
          if [ -f "npm run migrate" ]; then
            npm run migrate
          fi

      - name: Run tests
        working-directory: main/app
        run: npm test
